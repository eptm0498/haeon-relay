name: LIVE iPhone build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/live-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/live-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile LIVE for iPhone
        run: >
          xcodebuild -project ios/LIVE.xcodeproj -scheme LIVE -configuration Debug
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
